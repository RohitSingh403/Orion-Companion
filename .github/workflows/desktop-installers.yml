name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/linux-package-build-7bd1

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            script: build:linux
          - os: windows-latest
            label: Windows
            script: build:win
          - os: macos-latest
            label: macOS
            script: build:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--publish never)
          # GitHub exports a missing secret as an empty string. electron-builder
          # treats that string as a certificate path and resolves it to the repo
          # directory, which fails the Windows build. Drop the variables instead.
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            if [ "${{ matrix.label }}" = "macOS" ]; then
              ARGS+=(-c.mac.identity=null)
            fi
          fi
          if [ -z "${APPLE_ID:-}" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm run "${{ matrix.script }}" -- "${ARGS[@]}"
          node scripts/check-update-names.mjs release
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tag="v$(node -p "require('./package.json').version")"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --title "Orion Companion $tag" --notes "Desktop packages for $tag." || true
            fi
            # macOS runners ship bash 3.2, which has no mapfile.
            files=()
            while IFS= read -r file; do
              files+=("$file")
            done < <(find release -maxdepth 1 -type f ! -name 'builder-debug.yml')
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No installer files found in release/" >&2
              exit 1
            fi
            uploaded=0
            for _try in 1 2 3 4 5; do
              if gh release upload "$tag" "${files[@]}" --clobber; then
                uploaded=1
                break
              fi
              sleep 5
            done
            test "$uploaded" = 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: orion-${{ matrix.label }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.yaml
            release/*.blockmap

  tidy:
    name: Drop stale release files
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove assets the update manifests do not name
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          notes="$(mktemp -d)"
          gh release download "$tag" --pattern 'latest*.yml' --dir "$notes"
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            import { execFileSync } from "node:child_process";
            import { assetsToRemove } from "./scripts/check-update-names.mjs";
            const notes = process.argv[1];
            const tag = process.argv[2];
            const manifests = fs.readdirSync(notes).filter((name) => name.endsWith(".yml")).map((name) => ({
              name,
              yaml: fs.readFileSync(path.join(notes, name), "utf8"),
            }));
            const required = ["latest.yml", "latest-linux.yml", "latest-mac.yml"];
            const present = new Set(manifests.map((manifest) => manifest.name));
            const absent = required.filter((name) => !present.has(name));
            if (absent.length > 0) {
              console.error(`Missing update manifests: ${absent.join(", ")}`);
              process.exit(1);
            }
            const listed = JSON.parse(execFileSync("gh", ["release", "view", tag, "--json", "assets"], { encoding: "utf8" }));
            const stale = assetsToRemove(listed.assets.map((asset) => asset.name), manifests);
            for (const name of stale) {
              execFileSync("gh", ["release", "delete-asset", tag, name, "--yes"], { stdio: "inherit" });
            }
          ' "$notes" "$tag"
